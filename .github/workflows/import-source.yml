name: Import source snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download bootstrap-source-v1.4.8 --pattern LianAi-Keyboard-source-v1.4.8.zip --dir /tmp
      - name: Replace bootstrap with complete source
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/LianAi-Keyboard-source-v1.4.8.zip
          git config user.name "LianAi Release Bot"
          git config user.email "1213109176kgy-png@users.noreply.github.com"
          git add -A
          git commit -m "release: publish LianAi Keyboard v1.4.8"
          git push origin main