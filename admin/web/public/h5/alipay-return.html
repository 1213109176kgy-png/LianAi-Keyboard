<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>返回恋爱键盘</title>
<style>body{margin:0;background:#faf6f8;color:#392b32;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.card{max-width:360px;padding:32px;text-align:center}h1{font-size:23px}p{font-size:15px;line-height:1.7;color:#786b72}a{display:block;background:#e95887;border-radius:14px;padding:15px;color:white;text-decoration:none;margin-top:24px}</style>
</head>
<body><main class="card"><h1>返回恋爱键盘确认订单</h1><p>请点击下方按钮返回 App。App 会向服务器核实付款结果，确认到账后开通套餐。</p><a id="back" href="lianai://payment-return">返回 App 查看结果</a><p>若无法打开，请手动返回恋爱键盘，在「订阅套餐」中查询订单。</p></main>
<script>
const id=new URLSearchParams(location.search).get('orderId')||'';
if(/^LA[0-9A-F]+$/.test(id))document.getElementById('back').href='lianai://payment-return?orderId='+encodeURIComponent(id);
</script>
</body></html>
