<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在打开微信支付</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      color: #3a2a30;
    }
    .box { text-align: center; padding: 24px; }
    .spinner {
      width: 42px; height: 42px;
      margin: 0 auto 18px;
      border: 4px solid #ffe3ec;
      border-top-color: #ff6b9d;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .retry { color: #ff6b9d; text-decoration: none; font-size: 14px; display: inline-block; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 600;">正在打开微信支付…</div>
    <div style="font-size: 12.5px; color: #a08a92; margin-top: 6px;">如果没有自动跳转，请点击下方按钮</div>
    <a class="retry" id="go" href="javascript:void(0)">立即打开微信支付</a>
  </div>
  <script>
    // 仅允许跳转微信支付域名，防止本页被当作任意跳转器
    var to = new URLSearchParams(location.search).get('to') || ''
    var safe = /^https:\/\/wx\.tenpay\.com\//.test(to)
    if (safe) {
      document.getElementById('go').href = to
      setTimeout(function () { location.replace(to) }, 600)
    } else {
      document.querySelector('.box').innerHTML =
        '<div style="font-size:15px;">支付链接无效，请返回 App 重新发起支付</div>'
    }
  </script>
</body>
</html>
